name: farah
description: Wedding & Event Venue Booking App for Libya
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
cached_network_image: ^3.3.1
  flutter_animate: ^4.5.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  share_plus: ^10.1.1
  http: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
