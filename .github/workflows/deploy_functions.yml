name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Function Dependencies
        run: |
          cd functions
          npm install

      - name: Decode Firebase Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | base64 -d > ${{ github.workspace }}/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/gcp-key.json" >> $GITHUB_ENV

      - name: Verify Service Account
        run: |
          node -e "const j = require('${{ github.workspace }}/gcp-key.json'); console.log('✅ Project:', j.project_id); console.log('✅ Client:', j.client_email);"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Cloud Functions
        run: |
          firebase deploy --only functions --force --project ${{ secrets.FIREBASE_PROJECT_ID }}
