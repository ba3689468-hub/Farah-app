name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean project
        run: cd farah && flutter clean

      - name: Get dependencies
        run: cd farah && flutter pub get

      - name: Build APK
        run: cd farah && flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farah-apk
          path: farah/build/app/outputs/flutter-apk/app-debug.apk
