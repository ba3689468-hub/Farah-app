name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean project
        run: cd farah && flutter clean

      - name: Get dependencies
        run: cd farah && flutter pub get

      - name: Build APK
        run: cd farah && flutter build apk --debug

      # ✅ رفع التطبيق إلى قسم Releases بدلاً من Artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: farah/build/app/outputs/flutter-apk/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
