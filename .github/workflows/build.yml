name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# ✅ إضافة الصلاحيات اللازمة لإتمام الإصدار (Release)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ✅ خطوة تنظيف المساحة
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      # ✅ التعديل الأساسي: تثبيت نسخة NDK مستقرة بدلاً من مسح الكاش فقط
      - name: Install Stable NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - name: Clean project
        run: cd farah && flutter clean

      - name: Get dependencies
        run: cd farah && flutter pub get

      - name: Build APK
        run: cd farah && flutter build apk --debug

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: farah/build/app/outputs/flutter-apk/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
