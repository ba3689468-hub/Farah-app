name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# ✅ إضافة الصلاحيات اللازمة لإتمام الإصدار (Release)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ✅ خطوة تنظيف المساحة
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      # ✅ استبدلنا الخطوة القديمة بهذه الخطوة الأكثر استقراراً
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Clean project
        run: cd farah && flutter clean

      - name: Get dependencies
        run: cd farah && flutter pub get

      # ✅ تمرير مسار NDK للتأكد من أن فلاتر سيستخدمه
      - name: Build APK
        run: cd farah && flutter build apk --debug
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: farah/build/app/outputs/flutter-apk/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
