name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# إضافة الصلاحيات اللازمة لإنشاء الإصدار (Release)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ✅ خطوة تنظيف المساحة
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      # ✅ خطوة تنظيف NDK التالف
      - name: Clean NDK cache
        run: |
          rm -rf $ANDROID_HOME/ndk
          rm -rf $ANDROID_HOME/.downloadIntermediates
          rm -rf $ANDROID_HOME/cmdline-tools/latest
          echo "NDK cache cleaned"

      - name: Clean project
        run: cd farah && flutter clean

      - name: Get dependencies
        run: cd farah && flutter pub get

      - name: Build APK
        run: cd farah && flutter build apk --debug

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: farah/build/app/outputs/flutter-apk/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
