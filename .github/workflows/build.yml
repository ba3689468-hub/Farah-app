name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: cd farah && flutter pub get
      - run: cd farah && flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: farah-apk
          path: farah/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
