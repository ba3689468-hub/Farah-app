name: Flutter Web Deploy
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd farah && flutter pub get
      - run: cd farah && flutter build web --release
      - name: Check build output
        run: |
          echo "=== farah/build ==="
          ls -la farah/build/ || echo "NOT FOUND"
          echo "=== farah/build/web ==="
          ls -la farah/build/web/ | head -20 || echo "NOT FOUND"
          echo "=== firebase.json ==="
          cat firebase.json
      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | base64 -d > ${{ github.workspace }}/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="${{ github.workspace }}/gcp-key.json"
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} --debug
