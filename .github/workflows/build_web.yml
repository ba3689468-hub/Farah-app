name: Flutter Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        run: cd farah && flutter pub get

      - name: Build web
        run: cd farah && flutter build web --release

      - name: Decode credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | base64 -d > ${{ github.workspace }}/gcp-key.json

      - name: Set credentials env
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/gcp-key.json" >> $GITHUB_ENV

      - name: Install Firebase
        run: npm install -g firebase-tools

      - name: Deploy
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}
